<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}" defer></script>
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>Notepad Tracker</h1>
            <p>Write notes and track your changes using Git.</p>
        </header>

        <section class="file-section">
            <label for="file-path">File Path</label>
            <div class="file-controls">
                <input
                    type="text"
                    id="file-path"
                    placeholder="Enter the complete file path"
                >
                <button id="new-btn" type="button">New</button>
                <button id="open-btn" type="button">Open</button>
                <button id="save-btn" type="button">Save</button>
            </div>
        </section>

        <section class="editor-section">
            <div class="editor-header">
                <label for="editor">Editor</label>
                <span id="save-status">Ready</span>
            </div>

            <textarea
                id="editor"
                placeholder="Start writing your notes here..."
                spellcheck="true"
            ></textarea>
        </section>
    </main>
</body>
</html>
